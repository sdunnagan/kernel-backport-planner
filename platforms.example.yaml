# Example only. All identifiers and names are fictional placeholders.
# Do not interpret this file as Red Hat certification data.
version: 1
name: example-user-managed-platforms
unmatched_board: TAKE  # TAKE (default), REVIEW or aggressive SKIP
platforms:
  - name: Example ARM development board
    architecture: arm64
    paths:
      - 'arch/arm64/boot/dts/example/example-board*.dts'
    identifiers:
      dt_compatible:
        - 'example,selected-board'

  - name: Example x86 system
    architecture: x86
    paths:
      - 'drivers/platform/x86/example_*.c'
    identifiers:
      acpi_hid:
        - 'EXMP0001'
      pci_id:
        - '1234:abcd'

# Optional explicit negative scope. Do not infer that an unlisted board is unsupported.
excluded_platforms:
  - name: Example excluded ARM board
    architecture: arm64
    paths:
      - 'arch/arm64/boot/dts/example/other-board*.dts'
